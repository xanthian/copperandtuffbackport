plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}
def targetLoader = providers.gradleProperty('loader').getOrElse('forge')
if (!(targetLoader in ['forge', 'neoforge'])) throw new GradleException('loader must be forge or neoforge')
version = mod_version
group = mod_group_id
base { archivesName = 'CopperandTuffBackport-Forge-NeoForge' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
repositories { mavenCentral() }
sourceSets {
    clientSmoke {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
tasks.register('prepareClientSmoke') {
    doLast {
        def config = layout.buildDirectory.file("client-smoke-${targetLoader}/config/fml.toml").get().asFile
        config.parentFile.mkdirs()
        config.text = 'earlyWindowControl = false\n'
        new File(config.parentFile.parentFile, 'smoke-success.flag').delete()
    }
}
legacyForge {
    enable {
        if (targetLoader == 'neoforge') neoForgeVersion = "${minecraft_version}-${neoforge_version}"
        else forgeVersion = "${minecraft_version}-${forge_version}"
        disableRecompilation = true
    }
    mods {
        copperandtuffbackport { sourceSet sourceSets.main }
        copperandtuffbackport_client_smoke { sourceSet sourceSets.clientSmoke }
        copperandtuffbackport_test { sourceSet sourceSets.gametest }
    }
    runs {
        clientSmoke {
            client()
            sourceSet = sourceSets.clientSmoke
            loadedMods = [mods.copperandtuffbackport, mods.copperandtuffbackport_client_smoke]
            gameDirectory = layout.buildDirectory.dir("client-smoke-${targetLoader}").get().asFile
            programArguments.addAll '--width', '960', '--height', '900', '--mixin.config', 'client-smoke.mixins.json'
            systemProperty 'fml.earlyprogresswindow', 'false'
            taskBefore tasks.named('prepareClientSmoke')
        }
        client { client(); loadedMods = [mods.copperandtuffbackport] }
        server { server(); programArgument '--nogui'; loadedMods = [mods.copperandtuffbackport] }
        gameTestServer {
            type = 'gameTestServer'
            programArguments.addAll '--mixin.config', 'mixin-cooperation-tests.json'
            gameDirectory = layout.buildDirectory.dir("gametest-${targetLoader}").get().asFile
            sourceSet = sourceSets.gametest
            loadedMods = [mods.copperandtuffbackport, mods.copperandtuffbackport_test]
            systemProperty 'forge.enabledGameTestNamespaces', 'copperandtuffbackport,copperandtuffbackport_test'
        }
    }
}
dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.5'))
    jarJar(implementation('io.github.llamalad7:mixinextras-forge:0.5.5')) {
        version { strictly '[0.5.5,)'; prefer '0.5.5' }
    }
}
configurations.clientSmokeAnnotationProcessor.extendsFrom configurations.annotationProcessor
configurations.gametestAnnotationProcessor.extendsFrom configurations.annotationProcessor
mixin {
    add sourceSets.gametest, 'gametest.refmap.json'
    add sourceSets.clientSmoke, 'client-smoke.refmap.json'
    add sourceSets.main, 'copperandtuffbackport.refmap.json'
    config 'copperandtuffbackport.mixins.json'
}
processResources {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/mods.toml') { expand mod_version: project.version }
}
jar { manifest.attributes('MixinConfigs': 'copperandtuffbackport.mixins.json', 'Implementation-Version': project.version) }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.named('runGameTestServer').configure {
    doFirst { layout.buildDirectory.file("gametest-${targetLoader}/logs/latest.log").get().asFile.delete() }
    doLast {
        def log = layout.buildDirectory.file("gametest-${targetLoader}/logs/latest.log").get().asFile
        if (!log.exists() || !(log.text =~ /All 28 required tests passed/).find())
            throw new GradleException("The 28 parity tests did not pass on ${targetLoader}; inspect ${log}.")
    }
}
tasks.named('runClientSmoke').configure {
    doLast {
        def flag = layout.buildDirectory.file("client-smoke-${targetLoader}/smoke-success.flag").get().asFile
        if (!flag.exists() || flag.text != 'passed') throw new GradleException("Client rendering check did not finish on ${targetLoader}.")
    }
}
tasks.named('reobfJar').configure { dependsOn tasks.named('compileGametestJava'), tasks.named('compileClientSmokeJava') }
