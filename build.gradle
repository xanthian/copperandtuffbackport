plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {

}

dependencies {
    compileOnly 'org.jetbrains:annotations:24.0.0'
    // These injectors are supplied at runtime by Fabric Loader 0.15+.
    compileOnly 'io.github.llamalad7:mixinextras-fabric:0.3.5'
    annotationProcessor 'io.github.llamalad7:mixinextras-fabric:0.3.5'

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

sourceSets {
    clientSmoke {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    modImplementation fabricApi.module('fabric-gametest-api-v1', project.fabric_version)
}

loom {
    mods {
        copperandtuffbackport { sourceSet sourceSets.main }
        copperandtuffbackport_test { sourceSet sourceSets.gametest }
        copperandtuffbackport_client_smoke { sourceSet sourceSets.clientSmoke }
    }
    runs {
        clientSmoke {
            client()
            name = 'Copper Age rendering smoke test'
            source sourceSets.clientSmoke
            runDir 'build/client-smoke'
            programArgs '--width', '960', '--height', '900'
        }
        gametest {
            server()
            name = 'Block parity tests'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile}"
            runDir 'build/gametest'
        }
    }
}

processResources {
    def resourceProperties = [version: project.version,
                              minecraft_version: project.minecraft_version,
                              loader_version: project.loader_version]
    inputs.properties resourceProperties
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand resourceProperties
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {

    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)

    withSourcesJar()
}

jar {
    def licenseSuffix = project.base.archivesName.get()
    from("LICENSE") {
        rename { "${it}_${licenseSuffix}"}
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {

    }
}
