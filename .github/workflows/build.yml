name: build
on: [pull_request, push]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        loader: [forge, neoforge]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: microsoft
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: microsoft
      - uses: gradle/actions/setup-gradle@v5
      - name: Make wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew
      - name: Download Minecraft assets with retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew -Ploader=${{ matrix.loader }} downloadAssets --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Asset download attempt $attempt failed; retrying missing assets in 10 seconds."
              sleep 10
            fi
          done
          echo "Minecraft asset downloads failed after three attempts."
          exit 1
      - name: Build and test
        run: ./gradlew -Ploader=${{ matrix.loader }} build runGameTestServer --no-daemon
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux' && matrix.loader == 'neoforge'
        with:
          name: CopperandTuffBackport-Forge-NeoForge
          path: |
            build/libs/CopperandTuffBackport-Forge-NeoForge-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
