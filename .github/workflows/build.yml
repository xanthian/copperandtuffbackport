name: build
on: [pull_request, push]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        loader: [forge, neoforge]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: microsoft
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: microsoft
      - uses: gradle/actions/setup-gradle@v5
      - name: Make wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew
      - name: Build and test
        run: ./gradlew -Ploader=${{ matrix.loader }} build runGameTestServer --no-daemon
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Linux'
        with:
          name: ${{ matrix.loader }}-Artifacts
          path: build/libs/*Forge-NeoForge*.jar
